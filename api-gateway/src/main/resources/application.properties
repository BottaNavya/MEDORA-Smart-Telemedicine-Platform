# PORT
server.port=8080

# APP NAME
spring.application.name=api-gateway

# EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# AUTO ROUTING USING SERVICE NAME
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=practitioner-service
spring.cloud.gateway.routes[1].uri=lb://PRACTITIONER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/practitioners/**

spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/appointments/**

spring.cloud.gateway.routes[3].id=patient-service
spring.cloud.gateway.routes[3].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/patients/**

spring.cloud.gateway.routes[4].id=prescription-service
spring.cloud.gateway.routes[4].uri=lb://PRESCRIPTION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/prescriptions/**